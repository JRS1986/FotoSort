[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "fotosort"
version = "0.2.0"
description = "Pick the best, most varied photos out of thousands of JPEGs: sharpness, CLIP aesthetics, subject detection, burst dedup, an optional vision-model judge, and style-aware enhancement."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jan R. Seyler" }]
keywords = ["photography", "culling", "clip", "aesthetics", "wildlife", "safari", "burst"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "torch>=2.4",
    "open_clip_torch>=2.26",
    "ultralytics>=8.3",
    "timm>=1.0",
    "rawpy>=0.20",
    "exifread>=3.0",
    "pillow>=10.0",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.optional-dependencies]
judge = ["openai>=1.50", "anthropic>=1.3"]
dev = ["pytest>=8.0", "ruff>=0.5", "openai>=1.50", "build>=1.2", "twine>=6.1"]

[project.scripts]
fotosort = "fotosort.__main__:main"

[project.urls]
Homepage = "https://github.com/JRS1986/FotoSort"
Issues = "https://github.com/JRS1986/FotoSort/issues"

[tool.setuptools]
packages = ["fotosort"]
include-package-data = false

[tool.setuptools.package-data]
fotosort = ["static/*.html", "static/*.css", "static/*.js"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
