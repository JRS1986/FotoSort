name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The unit tests cover the pure-Python logic (scoring, grouping, selection,
      # enhancement, report parsing) and do not need torch or the model weights.
      - name: Install test dependencies
        run: pip install pillow numpy tqdm openai pytest ruff
      - name: Lint
        run: ruff check fotosort tests
      - name: Test
        run: pytest -q
      - name: Build and validate distributions
        run: |
          pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Smoke test installed wheel outside the source tree
        run: |
          pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          fotosort --help
          fotosort enhance --help
          fotosort decisions --help
          fotosort review --help
          python -c "from importlib.resources import files; assert files('fotosort').joinpath('static/review.html').is_file()"
          python -m fotosort --help
